<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3. Isaac Sim MarineCity Multi-UAV Benchmark</title>
  <desc id="desc">Synthetic coastal city benchmark setup with drones, objects, environmental parameters, and exported labels.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.sea{fill:#bae6fd}.road{fill:#d1d5db}.park{fill:#bbf7d0}.bldg{fill:#cbd5e1;stroke:#64748b;stroke-width:2}
      .title{font:700 28px Arial, sans-serif;fill:#0f172a}.sub{font:400 15px Arial, sans-serif;fill:#475569}.label{font:700 16px Arial, sans-serif;fill:#0f172a}.small{font:400 13px Arial, sans-serif;fill:#334155}
      .panel{fill:#fff;stroke:#334155;stroke-width:2;rx:12}.drone{fill:#111827}.view{fill:#fef3c7;stroke:#b45309;stroke-width:2;opacity:.75}.arrow{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .out{fill:#e0f2fe;stroke:#0369a1;stroke-width:2;rx:10}.param{fill:#ede9fe;stroke:#6d28d9;stroke-width:2;rx:10}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="title" x="60" y="56">MarineCity Multi-UAV Benchmark in NVIDIA Isaac Sim</text>
  <text class="sub" x="60" y="84">Controlled altitude, view angle, weather, and object density for reproducible multi-drone experiments.</text>

  <rect class="sea" x="60" y="140" width="470" height="390" rx="18"/>
  <rect class="park" x="100" y="365" width="390" height="135" rx="12"/>
  <rect class="road" x="85" y="310" width="420" height="42" rx="8"/>
  <rect class="bldg" x="105" y="190" width="70" height="95"/><rect class="bldg" x="195" y="170" width="90" height="115"/>
  <rect class="bldg" x="310" y="200" width="75" height="85"/><rect class="bldg" x="405" y="180" width="70" height="105"/>
  <rect x="150" y="320" width="34" height="18" rx="5" fill="#2563eb"/><rect x="290" y="318" width="38" height="20" rx="5" fill="#dc2626"/>
  <circle cx="228" cy="420" r="8" fill="#111827"/><circle cx="255" cy="440" r="8" fill="#111827"/><circle cx="352" cy="415" r="8" fill="#111827"/>

  <polygon class="view" points="230,130 155,310 300,310"/>
  <polygon class="view" points="400,125 315,310 475,310"/>
  <polygon class="view" points="300,90 235,360 390,360"/>
  <circle class="drone" cx="230" cy="130" r="13"/><circle class="drone" cx="400" cy="125" r="13"/><circle class="drone" cx="300" cy="90" r="13"/>
  <text class="small" x="195" y="113">UAV-A</text><text class="small" x="410" y="112">UAV-B</text><text class="small" x="310" y="78">UAV-C</text>
  <text class="label" x="84" y="565">Coastal city digital twin</text>

  <rect class="panel param" x="600" y="145" width="235" height="230"/>
  <text class="label" x="625" y="178">Scenario Controls</text>
  <text class="small" x="625" y="214">drone count: 2-6</text>
  <text class="small" x="625" y="238">altitude: 20-120 m</text>
  <text class="small" x="625" y="262">yaw / pitch / FOV grid</text>
  <text class="small" x="625" y="286">pedestrian density</text>
  <text class="small" x="625" y="310">vehicle density</text>
  <text class="small" x="625" y="334">clear / rain / snow / fog</text>

  <rect class="panel out" x="895" y="145" width="245" height="230"/>
  <text class="label" x="920" y="178">Exported Benchmark</text>
  <text class="small" x="920" y="214">RGB multi-view images</text>
  <text class="small" x="920" y="238">camera pose and intrinsics</text>
  <text class="small" x="920" y="262">depth and 3D metadata</text>
  <text class="small" x="920" y="286">2D boxes and object IDs</text>
  <text class="small" x="920" y="310">weather and occlusion tags</text>
  <text class="small" x="920" y="334">ambiguity / re-view labels</text>

  <rect class="panel" x="600" y="425" width="540" height="120"/>
  <text class="label" x="625" y="458">Evaluation Tasks</text>
  <text class="small" x="625" y="492">1. small-object detection under viewpoint and weather shift</text>
  <text class="small" x="625" y="516">2. cross-view association, 3D evidence completion, and re-observation</text>
  <path class="arrow" d="M530 330 C565 330 570 260 600 260"/>
  <path class="arrow" d="M835 260 L895 260"/>
  <path class="arrow" d="M1018 375 L1018 425"/>
</svg>
