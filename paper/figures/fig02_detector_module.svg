<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Figure 2. P2P4-SelfAttnFR Detector Candidate Schematic</title>
  <desc id="desc">Working schematic of the P2P4-SelfAttnFR detector candidate; final model may change.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}
      .sub{font:400 16px Arial,sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#1f2937;stroke-width:2;rx:10}
      .base{fill:#e0f2fe;stroke:#0369a1}
      .p2{fill:#dcfce7;stroke:#15803d}
      .mod{fill:#fef3c7;stroke:#b45309}
      .out{fill:#fee2e2;stroke:#b91c1c}
      .note{fill:#eef2ff;stroke:#4338ca}
      .label{font:700 18px Arial,sans-serif;fill:#111827}
      .small{font:400 14px Arial,sans-serif;fill:#374151}
      .tiny{font:400 12px Arial,sans-serif;fill:#475569}
      .math{font:400 13px Courier New,monospace;fill:#111827}
      .arrow{stroke:#1f2937;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#64748b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;fill:none}
      .tableHead{fill:#334155}
      .tableText{font:700 13px Arial,sans-serif;fill:#fff}
      .cellText{font:400 13px Arial,sans-serif;fill:#111827}
      .win{fill:#dcfce7}
      .warn{fill:#fef9c3}
    </style>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="title" x="60" y="56">Selected Detector Candidate Schematic: P2P4-SelfAttnFR</text>
  <text class="sub" x="60" y="86">Working structure guide; keep only selected modules in the main paper figure.</text>

  <rect class="box" x="60" y="145" width="150" height="110"/>
  <text class="label" x="93" y="188">UAV RGB</text>
  <text class="small" x="90" y="218">VisDrone</text>
  <text class="small" x="88" y="238">imgsz 1280</text>

  <rect class="box base" x="260" y="130" width="220" height="140"/>
  <text class="label" x="304" y="170">YOLOv11l</text>
  <text class="label" x="300" y="194">Backbone</text>
  <text class="small" x="290" y="226">P2/4, P3/8, P4/16, P5/32</text>
  <text class="small" x="290" y="246">initialized from yolo11l.pt</text>

  <rect class="box base" x="535" y="130" width="245" height="140"/>
  <text class="label" x="590" y="170">FPN/PAN Neck</text>
  <text class="small" x="570" y="206">multi-scale fusion</text>
  <text class="small" x="570" y="226">upsample + concat + C3k2</text>
  <text class="small" x="570" y="246">Detect inputs: P2, P3, P4</text>

  <path class="arrow" d="M210 200 L260 200"/>
  <path class="arrow" d="M480 200 L535 200"/>

  <rect class="box p2" x="845" y="75" width="185" height="105"/>
  <text class="label" x="895" y="112">P2 / 4</text>
  <text class="small" x="880" y="142">layer 19, 128ch</text>
  <text class="tiny" x="875" y="162">tiny-object head</text>

  <rect class="box p2" x="845" y="205" width="185" height="105"/>
  <text class="label" x="895" y="242">P3 / 8</text>
  <text class="small" x="880" y="272">layer 22, 256ch</text>
  <text class="tiny" x="879" y="292">small-object head</text>

  <rect class="box p2" x="845" y="335" width="185" height="105"/>
  <text class="label" x="890" y="372">P4 / 16</text>
  <text class="small" x="878" y="402">layer 25, 512ch</text>
  <text class="tiny" x="880" y="422">medium context</text>

  <rect class="box p2" x="845" y="465" width="185" height="105"/>
  <text class="label" x="890" y="502">P5 / 32</text>
  <text class="small" x="878" y="532">layer 28, 512ch</text>
  <text class="tiny" x="884" y="552">context only</text>

  <path class="thin" d="M780 175 C805 150 815 125 845 128"/>
  <path class="thin" d="M780 202 L845 258"/>
  <path class="thin" d="M780 220 C810 275 815 365 845 388"/>
  <path class="thin" d="M780 240 C820 340 815 490 845 518"/>

  <rect class="box mod" x="1090" y="75" width="245" height="235"/>
  <text class="label" x="1138" y="112">SelfAttnFR</text>
  <text class="small" x="1120" y="145">local self-attention refinement</text>
  <text class="small" x="1120" y="166">frequency-aware residual path</text>
  <text class="math" x="1115" y="202">A = softmax(QK^T/sqrt(d))</text>
  <text class="math" x="1115" y="226">Y = F + gamma AV + beta HF</text>
  <text class="tiny" x="1120" y="268">applied to P2/P3/P4 evidence</text>
  <text class="tiny" x="1120" y="288">keeps compact parameter budget</text>

  <rect class="box mod" x="1090" y="365" width="245" height="225"/>
  <text class="label" x="1125" y="402">TinySpatialFReLU</text>
  <text class="small" x="1120" y="435">depthwise spatial condition</text>
  <text class="small" x="1120" y="456">high-frequency residual</text>
  <text class="math" x="1115" y="492">HF = F - AvgPool(F)</text>
  <text class="math" x="1115" y="516">C = DWConv(F) + beta HF</text>
  <text class="math" x="1115" y="540">Y = max(F, C)</text>
  <text class="tiny" x="1120" y="574">keeps weak tiny-object edges</text>

  <path class="arrow" d="M1030 128 L1090 128"/>
  <path class="arrow" d="M1030 258 L1090 258"/>
  <path class="arrow" d="M1030 388 L1090 432"/>
  <path class="arrow" d="M1030 518 L1090 518"/>
  <path class="dash" d="M1212 310 L1212 365"/>

  <rect class="box out" x="1405" y="205" width="135" height="185"/>
  <text class="label" x="1432" y="244">Detect</text>
  <text class="small" x="1430" y="278">P2/P3/P4</text>
  <text class="small" x="1432" y="304">bbox</text>
  <text class="small" x="1432" y="326">class</text>
  <text class="small" x="1432" y="348">confidence</text>
  <path class="arrow" d="M1335 295 L1405 295"/>

  <rect class="box note" x="60" y="640" width="1480" height="98"/>
  <text class="label" x="85" y="672">Main-paper detector wording</text>
  <text class="small" x="85" y="700">P2P4-SelfAttnFR improves AP/AP50 over YOLOv11l with fewer parameters, but uses higher GFLOPs. Keep search-only rows in the supplement.</text>
  <text class="small" x="85" y="724">Report final numbers in the result table: AP 0.3822, AP50 0.6052, Params 20.82M.</text>
</svg>
