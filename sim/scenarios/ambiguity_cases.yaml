ambiguity_cases:
  - id: van_vs_ambulance
    missing_evidence:
      - side marking
      - roof light bar
      - vehicle side profile
    recommended_view: right_oblique
  - id: sedan_vs_pickup
    missing_evidence:
      - rear cargo bed
      - side silhouette
    recommended_view: rear_oblique
  - id: truck_vs_rescue_vehicle
    missing_evidence:
      - emergency marking
      - vehicle equipment outline
    recommended_view: side_oblique
  - id: pedestrian_vs_worker
    missing_evidence:
      - safety vest
      - helmet
      - work zone context
    recommended_view: front_oblique
  - id: small_boat_vs_debris
    missing_evidence:
      - object shape
      - wake pattern
      - nearby sea context
    recommended_view: left_oblique
