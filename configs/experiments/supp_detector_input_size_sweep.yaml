name: supp_detector_input_size_control_1280
description: >
  Supplementary-only detector input-size control fixed to the paper protocol.
  The active queue should not spend time on low-resolution 640/650-style
  training; all new detector runs stay at 1280-pixel input.

data_yaml: configs/detector/visdrone_yolo_data.yaml
dataset_tag: visdrone_input_size_sweep
project: outputs/detectors/server_input_size_sweep
log_dir: outputs/logs/server_baselines
experiment_root: outputs/experiments
command_csv: outputs/experiments/supp_detector_input_size_sweep_commands.csv

training:
  imgsz_list: [1280]
  epochs: 100
  patience: 5
  seeds: [42]
  deterministic: true
  run_eval: true
  roc_auc: true
  batch_by_imgsz:
    1280: 4

final_statistical_expansion:
  seeds: [42, 123, 2026]
  patience: 5
  trigger: >
    Expand only the strongest baseline and strongest proposed detector at the
    fixed 1280-pixel paper protocol.

base_models:
  - yolo11l.pt

ablations:
  - name: resolution_control
    method_template: InputSize-YOLOv11l-{base_slug}
    train_model_template: "{base_model}"
    init_weights_template: ""
    implementation_status: implemented
    proposed_module: resolution_control
    model_patches: ""
    enabled: true
    notes: >
      Strongest current baseline family under the fixed paper input protocol.

  - name: p2_tiny_frelu
    method_template: InputSize-P2TinyFReLU-{base_slug}
    train_model_template: configs/detector/yolo11l-p2.yaml
    init_weights_template: yolo11l.pt
    implementation_status: implemented
    proposed_module: p2_head+tiny_frelu_neck
    model_patches: tiny_frelu_neck
    enabled: true
    requires:
      - configs/detector/yolo11-p2.yaml
      - yolo11l.pt
      - detectors/proposed/modules.py
    notes: >
      Proposed small-object detector candidate. Compare against the fixed
      1280-pixel control.

supplementary_reporting:
  figures:
    - ablation_delta_heatmap.png
  metrics:
    - AP
    - AP50
    - recall
    - F1
    - FPS
    - latency_ms
    - Params
    - GFLOPs
  reviewer_question_answered: >
    Does the proposed detector improve small-object evidence under the fixed
    1280-pixel protocol?
