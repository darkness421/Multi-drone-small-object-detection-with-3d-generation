name: yolov11_p2_slim_size_reduction
description: >
  Size-reduction search for the proposed detector. Keep the stride-4 P2
  small-object head and TinySpatialFReLU idea, but slim the added neck/head so
  the detector can compete closer to YOLOv11l's parameter budget.

data_yaml: configs/detector/visdrone_yolo_data.yaml
dataset_tag: visdrone_yolov11_p2_slim
project: outputs/detectors/server_yolov11_p2_slim
log_dir: outputs/logs/server_yolov11_p2_slim
experiment_root: outputs/experiments
command_csv: outputs/experiments/yolov11_p2_slim_size_reduction_commands.csv

training:
  imgsz: 1280
  epochs: 100
  patience: 5
  batch: 4
  seeds: [42]
  deterministic: true
  run_eval: true
  roc_auc: true

baseline_reference:
  method: YOLOv11l
  model: yolo11l.pt
  AP: 0.3776566666666667
  AP50: 0.59809
  F1: 0.624751330466615
  Params_M: 25.32
  GFLOPs: 87.3

base_models:
  - yolo11l.pt

ablations:
  - name: p2_slim_tiny_frelu
    method_template: ProposedSize-P2SlimTinyFReLU-{base_slug}
    train_model_template: configs/detector/yolo11l-p2-slim.yaml
    init_weights_template: yolo11l.pt
    implementation_status: implemented
    proposed_module: p2_slim_head+tiny_frelu_neck
    model_patches: tiny_frelu_neck
    enabled: true
    requires:
      - configs/detector/yolo11l-p2-slim.yaml
      - detectors/proposed/modules.py
    notes: >
      Slim P2/P3/P4 path with TinySpatialFReLU. This is the first candidate
      for PASS-same-param or BEST-less-param style contribution.

  - name: p2_slim_wavelet_tiny_frelu
    method_template: ProposedSize-P2SlimWaveTinyFReLU-{base_slug}
    train_model_template: configs/detector/yolo11l-p2-slim.yaml
    init_weights_template: yolo11l.pt
    implementation_status: implemented
    proposed_module: p2_slim_head+wavelet_stem+tiny_frelu_neck
    model_patches: wavelet_stem,tiny_frelu_neck
    enabled: true
    requires:
      - configs/detector/yolo11l-p2-slim.yaml
      - detectors/proposed/modules.py
    notes: >
      Adds the low-cost high-frequency stem to the slim P2 detector. This
      tests whether edge restoration recovers tiny-object AP without much
      parameter growth.

decision_rule:
  first_pass: >
    Prefer any slim proposed model that exceeds YOLOv11l AP/AP50 while keeping
    Params within +/-1% of YOLOv11l. If both slim variants are below baseline,
    proceed to PixelShuffle/P2 and NMS-only follow-up.
  strong_pass: >
    AP >= 0.3833 and AP50 >= 0.6071 with Params <= 25.57M.
