name: top3_proposed_detector_screening
description: >
  Screening queue for the proposed perception module on the current VisDrone
  top-3 baselines. This stage uses one seed to identify the best backbone/module
  pair before expanding the winner to the main 3-seed or 5-seed statistical set.

data_yaml: configs/detector/visdrone_yolo_data.yaml
dataset_tag: visdrone_top3
project: outputs/detectors/server_top3_proposed_ablation
log_dir: outputs/logs/server_baselines
experiment_root: outputs/experiments
command_csv: outputs/experiments/top3_proposed_ablation_commands.csv

training:
  imgsz: 1280
  epochs: 100
  patience: 30
  batch: 8
  seeds: [42]
  deterministic: true
  run_eval: true
  roc_auc: true

base_models:
  - yolo12m.pt
  - yolov10m.pt
  - yolov9s.pt

ablations:
  - name: se_neck
    method_template: ProposedTop3-SE-{base_slug}
    train_model_template: "{base_model}"
    implementation_status: implemented
    proposed_module: se_neck
    model_patches: se_neck
    enabled: true
    requires:
      - detectors/proposed/modules.py
    notes: Low-cost channel recalibration baseline for each top-3 backbone.

  - name: cbam_neck
    method_template: ProposedTop3-CBAM-{base_slug}
    train_model_template: "{base_model}"
    implementation_status: implemented
    proposed_module: cbam_neck
    model_patches: cbam_neck
    enabled: true
    requires:
      - detectors/proposed/modules.py
    notes: Channel+spatial attention screening variant.

  - name: partial_deformable_neck
    method_template: ProposedTop3-DeformableNeck-{base_slug}
    train_model_template: "{base_model}"
    implementation_status: implemented
    proposed_module: partial_deformable_neck
    model_patches: partial_deformable_neck
    enabled: true
    requires:
      - detectors/proposed/modules.py
    notes: Geometry-aware neck refinement for dense and oblique UAV scenes.

  - name: wavelet_cbam
    method_template: ProposedTop3-WaveletCBAM-{base_slug}
    train_model_template: "{base_model}"
    implementation_status: implemented
    proposed_module: wavelet_stem+cbam_neck
    model_patches: wavelet_stem,cbam_neck
    enabled: true
    requires:
      - detectors/proposed/modules.py
    notes: Tests whether high-frequency stem and CBAM are complementary.

  - name: full_proposed
    method_template: ProposedTop3-Full-{base_slug}
    train_model_template: "{base_model}"
    implementation_status: implemented
    proposed_module: wavelet_stem+cbam_neck+partial_deformable_neck
    model_patches: wavelet_stem,cbam_neck,partial_deformable_neck
    enabled: true
    requires:
      - detectors/proposed/modules.py
    notes: Trainable full detector-side proposal; tiling remains eval-only after checkpoint selection.
